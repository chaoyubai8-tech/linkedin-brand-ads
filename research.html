    <header class="research-header">
      <div class="research-meta"><a href="index.html">← 返回广告首页</a><span>TRIPO · 创意研究</span></div>

    </header>
    <nav class="research-nav" aria-label="栏目导航">
      <a href="index.html#gpt-campaign">广告创作</a>

    <section id="style-evidence" aria-label="领英行业参考与用户素材七项图证对照">
      <noscript>
        <h2>查看图证需要 JavaScript</h2>
        <p>本页保留了七项比较、案例来源与五条改稿原则。可直接查看<a href="style-evidence-data.json">完整研究数据</a>，或返回<a href="index.html#user-cases">用户案例库</a>看原图。</p>

    </section>
    <footer class="research-footer">
      <p>来源身份与核验边界逐图标注；本页不作投放效果排名，也不把概念图当作真实产品输出。</p>
      <a href="index.html">返回广告首页 →</a>
    </footer>
  </main>
  <script>
    (() => {
      if (location.hash !== '#style-fusion') return;
      const root = document.getElementById('style-evidence');
      const observer = new MutationObserver(() => {
        const target = document.getElementById('style-fusion');
        if (!target) return;
        observer.disconnect();
        requestAnimationFrame(() => target.scrollIntoView({block: 'start', behavior: 'instant'}));
      });
      observer.observe(root, {childList: true, subtree: true});
    })();
  </script>
  <script src="style-evidence.js?v=20261008-1" defer></script>
