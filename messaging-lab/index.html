<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tripo Teams 与 API 领英站内信审核稿：四组人群、十二版中英文案及完整流程。">
  <title>Tripo 领英站内信审核稿</title>
  <link rel="preload" href="../assets/v9/InstrumentSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="lab.css?v=review-r6">
  <script src="lab.js?v=review-r6" defer></script>
</head>
<body>
  <a class="skip-link" href="#workspace">跳到文案审阅</a>
  <header class="topbar">
    <a class="wordmark" href="#workspace" aria-label="查看站内信文案"><strong>TRIPO</strong></a>
    <nav aria-label="文案文件"><a href="all-copy.html">全部双语文案</a><a href="copy.csv" download>下载 CSV</a></nav>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <div><h1 id="page-title">领英站内信审核稿</h1></div>
      <p class="version-note">4 组 · 12 版<br>2026.10.12</p>
    </section>
    <nav id="group-nav" class="group-nav" aria-label="投放人群"><p>正在读取文案。</p></nav>
    <section id="workspace" class="workspace" aria-label="文案审阅工作区">
      <aside class="variant-sidebar" aria-labelledby="variant-list-title"><h2 id="variant-list-title">文案版本</h2><div id="variant-list"></div></aside>
      <div class="review-area">
        <header id="selected-heading" class="selected-heading"><h2>选择文案版本</h2></header>
        <div id="mode-nav" class="mode-nav" role="tablist" aria-label="审阅方式">
          <button id="tab-preview" role="tab" aria-selected="true" aria-controls="mode-preview" tabindex="0" data-mode="preview">中英版式预览</button>
          <button id="tab-path" role="tab" aria-selected="false" aria-controls="mode-path" tabindex="-1" data-mode="path">流程与双语全文</button>
        </div>
        <div id="copy-tools" class="review-toolbar"></div>
        <section id="mode-preview" role="tabpanel" aria-labelledby="tab-preview" class="mode-panel"><p class="loading">正在读取中英文案。</p></section>
        <section id="mode-path" role="tabpanel" aria-labelledby="tab-path" class="mode-panel" hidden></section>
        <p id="feedback" class="sr-only" role="status" aria-live="polite"></p>
      </div>
    </section>
    <section id="static-copy" class="static-copy" aria-labelledby="static-title">
      <h2 id="static-title">文案文件</h2>
      <!-- STATIC_COPY_START -->
      <p><a href="all-copy.html">全部双语文案</a> · <a href="copy.csv" download>下载 CSV</a></p>
      <!-- STATIC_COPY_END -->
    </section>
  </main>
</body>
</html>
