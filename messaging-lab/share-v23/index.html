<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tripo 领英站内信 V23：美国与欧洲独立文案，六组人群、每组四个单卖点版本，中英双语预览与完整对话流程。">
  <meta name="robots" content="noindex, nofollow">
  <title>Tripo 领英站内信 · V23</title>
  <link rel="preload" href="../../assets/v9/InstrumentSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="review.css?v=20261023-v23">
  <script src="review.js?v=20261023-v23" defer></script>
</head>
<body>
  <a class="skip-link" href="#review">跳到文案</a>
  <header class="masthead">
    <span class="wordmark" aria-label="Tripo">TRIPO</span>
    <p><a href="../share-v22/#TU-01/preview/both">V22 上一版</a> · <a href="../share-v21/#TU-01/preview/both">V21 历史稿</a> · 审稿预览</p>
  </header>
  <main id="main">
    <header class="page-heading">
      <h1>Tripo 领英站内信 <span>V23</span></h1>
      <p id="edition">美国／欧洲独立文案 · 6 组 × 4 版 · 每篇一个卖点</p>
    </header>
    <div id="load-state" role="status" class="load-state"><p>正在加载文案…</p><div class="loading-lines" aria-hidden="true"></div></div>
    <div id="app" hidden>
      <nav id="regions" class="region-nav" aria-label="投放地区"></nav>
      <nav id="groups" class="group-nav" aria-label="当前地区的人群选择"></nav>
      <section id="review" tabindex="-1" aria-labelledby="group-title">
        <header class="section-heading"><div><h2 id="group-title"></h2><p id="group-theme"></p></div><div class="language-nav" id="languages" role="group" aria-label="显示语言"></div></header>
        <nav id="variants" class="variant-nav" aria-label="本组文案版本"></nav>
        <div class="controls">
          <div id="views" role="tablist" aria-label="查看方式"><button id="tab-preview" type="button" role="tab" data-view="preview" aria-controls="content" aria-selected="true">消息预览</button><button id="tab-flow" type="button" role="tab" data-view="flow" aria-controls="content" aria-selected="false" tabindex="-1">完整流程</button><button id="tab-compare" type="button" role="tab" data-view="compare" aria-controls="content" aria-selected="false" tabindex="-1">版本对比</button></div>
          <div class="tools" aria-label="文案工具"><button type="button" data-tool="copy-en">复制英文</button><button type="button" data-tool="copy-zh">复制中文</button><button type="button" data-tool="download">下载本版 TXT</button><button type="button" data-tool="download-all">下载全部 24 版</button><button type="button" data-tool="print">打印全部 24 版</button></div>
        </div>
        <nav id="steps" class="step-nav" aria-label="消息流程"></nav>
        <p class="macro-note">%FIRSTNAME% 为领英姓名字段，正式发送时按收件人资料填入。</p>
        <div id="content" role="tabpanel" aria-labelledby="tab-preview" tabindex="-1"></div>
      </section>
    </div>
    <noscript><p class="error">请启用 JavaScript 查看双语文案与对话流程。本页面不发送消息，也不收集表单信息。</p></noscript>
  </main>
  <footer id="site-note">审稿预览 · 不会发送消息或收集信息。</footer>
  <p id="status" class="toast" role="status" aria-live="polite" hidden></p>
  <dialog id="copy-dialog" aria-labelledby="copy-title"><h2 id="copy-title">复制文案</h2><p>请选择下方文字，使用系统复制操作。</p><textarea id="copy-text" readonly aria-label="待复制文案"></textarea><button id="close-copy" type="button">关闭</button></dialog>
  <div id="print-document" aria-hidden="true"></div>
</body>
</html>
